<!doctype html><html><head><meta charset="utf-8">
<!-- Renders every candidate part set from candidates.json and scores it against the site's art
     (silhouette overlap + colour histogram). Driven by score.cjs; serve this folder with the
     game export's models/ and textures2/ and the site's img/ reachable next to it. -->
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
const S = 256, G = 48;
const r = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true }); r.setSize(S, S); r.setPixelRatio(1);
r.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(30, 1, 0.01, 100);
scene.add(new THREE.AmbientLight(0xffffff, 2.2)); const sun = new THREE.DirectionalLight(0xffffff, 1.4); sun.position.set(1, 2, 3); scene.add(sun);
const objCache = {}, texCache = {};
const obj = u => objCache[u] ||= new OBJLoader().loadAsync(u);
const tex = u => texCache[u] ||= new THREE.TextureLoader().loadAsync(u).then(t => { t.colorSpace = THREE.SRGBColorSpace; return t });
const cv = document.createElement('canvas'); cv.width = cv.height = S; const cx = cv.getContext('2d', { willReadFrequently: true });

// alpha-cropped, centred G x G signature: mask + 4x4x4 colour histogram
function sig(src, mirror) {
  cx.clearRect(0, 0, S, S); cx.save(); if (mirror) { cx.translate(S, 0); cx.scale(-1, 1) } cx.drawImage(src, 0, 0, S, S); cx.restore();
  const d = cx.getImageData(0, 0, S, S).data; let x0 = S, y0 = S, x1 = 0, y1 = 0;
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) if (d[(y * S + x) * 4 + 3] > 40) { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y) }
  if (x1 <= x0) return null;
  const w = x1 - x0 + 1, h = y1 - y0 + 1, k = Math.max(w, h) / G, ox = (G - w / k) / 2, oy = (G - h / k) / 2;
  const mask = new Uint8Array(G * G), hist = new Float32Array(64); let n = 0;
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const i = (y * S + x) * 4; if (d[i + 3] <= 40) continue;
    mask[Math.min(G - 1, (oy + (y - y0) / k) | 0) * G + Math.min(G - 1, (ox + (x - x0) / k) | 0)] = 1;
    hist[(d[i] >> 6) * 16 + (d[i + 1] >> 6) * 4 + (d[i + 2] >> 6)]++; n++;
  }
  for (let i = 0; i < 64; i++) hist[i] /= n;
  return { mask, hist };
}
function score(a, b) {
  let I = 0, U = 0, H = 0;
  for (let i = 0; i < G * G; i++) { I += a.mask[i] & b.mask[i]; U += a.mask[i] | b.mask[i] }
  for (let i = 0; i < 64; i++) H += Math.min(a.hist[i], b.hist[i]);
  return 0.55 * (U ? I / U : 0) + 0.45 * H;
}
window.scoreSlug = async (e) => {
  const art = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = e.art });
  const A = [sig(art, false), sig(art, true)];
  const res = [];
  for (const c of e.cands) {
    const root = new THREE.Group(); root.scale.x = -1;  // Unity is left-handed
    try {
      for (const [p, t] of c.parts) {
        const o = (await obj(p)).clone(), map = await tex(t);
        o.traverse(m => { if (m.isMesh) m.material = new THREE.MeshLambertMaterial({ map, alphaTest: 0.4, side: THREE.DoubleSide }) });
        root.add(o);
      }
    } catch (err) { res.push({ name: c.name, score: -1, err: String(err) }); continue }
    const box = new THREE.Box3().setFromObject(root), ctr = box.getCenter(new THREE.Vector3()), sz = box.getSize(new THREE.Vector3()).length();
    const pivot = new THREE.Group(); root.position.sub(ctr); pivot.add(root); scene.add(pivot);
    cam.position.set(0, sz * 0.15, sz * 1.5); cam.lookAt(0, 0, 0);
    let best = { s: -1 };
    for (const yaw of [-1.2, -0.6, 0, 0.6, 1.2]) {
      pivot.rotation.y = yaw; r.render(scene, cam);
      const R = sig(r.domElement, false); if (!R) continue;
      for (const a of A) { const s = score(R, a); if (s > best.s) best = { s, yaw, img: r.domElement.toDataURL('image/png') } }
    }
    scene.remove(pivot);
    res.push({ name: c.name, score: +best.s.toFixed(4), yaw: best.yaw, img: best.img, parts: c.parts });
  }
  res.sort((a, b) => b.score - a.score);
  return res;
};
document.title = 'ready';
</script></body></html>
