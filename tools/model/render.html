<!doctype html><html><head><meta charset="utf-8">
<!-- 2D images from 3d/<slug>.glb with exactly the site's viewer (viewer3d.js): Sparkling types and plain art
     where the game has none. Driven by render.cjs; serve tools/model with 3d/ and viewer3d.js reachable
     next to this file (symlinks). -->
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head><body style="margin:0">
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { buildModel, setupScene, frame } from './viewer3d.js';
const S = 640;
const r = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true }); r.setSize(S, S); r.setPixelRatio(1);
r.outputColorSpace = THREE.SRGBColorSpace; document.body.appendChild(r.domElement);
// look: {slug, kind ('' | s z d), glow, texFid, mats, t (idle time for the pose)}
window.renderLook = async (look) => {
  const scene = setupScene(THREE, r, { RoomEnvironment });
  const m = await buildModel(THREE, { GLTFLoader, MeshoptDecoder }, { url: look.url || `3d/${look.slug}.glb`, look, period: look.period || 3, motion: look.motion || {} });
  m.update(look.t ?? 0.6);
  m.root.position.sub(m.box.getCenter(new THREE.Vector3())); m.root.rotation.y = 0.6; scene.add(m.root);
  if (m.points) m.points.material.uniforms.uPx.value = S / 400;
  const cam = new THREE.PerspectiveCamera(30, 1, 0.01, 100); frame(THREE, cam, m.box, 0.6, 0.9);
  r.setClearColor(0, 0); r.render(scene, cam);
  const url = r.domElement.toDataURL('image/png');
  m.dispose();
  return url;
};
document.title = 'ready';
</script></body></html>
