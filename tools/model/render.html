<!doctype html><html><head><meta charset="utf-8">
<!-- Renders 2D images from 3d/<slug>.glb in the site's toon look: Sparkling types (variant texture + accent
     rim glow + sparkles) and plain art where the game has none. Driven by render.cjs; serve tools/model with
     3d/ reachable at ./3d/ (symlink). Must match mount3d() in index.html. -->
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head><body style="margin:0">
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
const S = 640;
const r = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true }); r.setSize(S, S); r.setPixelRatio(1);

const ramp = new THREE.DataTexture(new Uint8Array([90, 90, 90, 255, 180, 180, 180, 255, 255, 255, 255, 255]), 3, 1); ramp.minFilter = ramp.magFilter = THREE.NearestFilter; ramp.needsUpdate = true;

const rimMat = c => new THREE.ShaderMaterial({ transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, uniforms: { c: { value: new THREE.Color(c) } },
  vertexShader: 'varying vec3 n;varying vec3 v;void main(){vec4 p=modelViewMatrix*vec4(position,1.);n=normalize(normalMatrix*normal);v=normalize(-p.xyz);gl_Position=projectionMatrix*p;}',
  fragmentShader: 'uniform vec3 c;varying vec3 n;varying vec3 v;void main(){float f=pow(1.-abs(dot(n,v)),4.);gl_FragColor=vec4(c*f*0.75,1.);}' });

const cache = {};
// look: {slug, mats:[names], fid, kind ('' plain | n s z d), accent:'#rrggbb'|null, yaw}
window.renderLook = async (look) => {
  const g = await (cache[look.slug] ||= loader.loadAsync(`3d/${look.slug}.glb`));
  const root = g.scene.clone(true), meshes = [];

    const i = look.kind && o.material.name.startsWith('body:') ? look.mats.indexOf(o.material.name.slice(5)) : -1;
    if (i >= 0) { map = await tl.loadAsync(`3d/v/${look.fid}-${look.kind}-${i}.webp`); map.flipY = false; map.colorSpace = THREE.SRGBColorSpace }
    o.material = new THREE.MeshToonMaterial({ map, gradientMap: ramp, alphaTest: 0.4, side: THREE.DoubleSide });
    o.add(new THREE.Mesh(o.geometry, outline));

  }
  const scene = new THREE.Scene();
  scene.add(new THREE.AmbientLight(0xffffff, 1.6)); const sun = new THREE.DirectionalLight(0xffffff, 2.2); sun.position.set(2, 3, 2); scene.add(sun);
  const box = new THREE.Box3().setFromObject(root), c = box.getCenter(new THREE.Vector3()), size = box.getSize(new THREE.Vector3());
  const pivot = new THREE.Group(); root.position.sub(c); pivot.add(root); pivot.rotation.y = look.yaw ?? 0.6; scene.add(pivot);

    let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    const cv = document.createElement('canvas'); cv.width = cv.height = 64; const x = cv.getContext('2d');
    const gr = x.createRadialGradient(32, 32, 0, 32, 32, 32); gr.addColorStop(0, '#fff'); gr.addColorStop(0.25, look.accent); gr.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = gr; x.beginPath(); x.moveTo(32, 0); x.quadraticCurveTo(36, 28, 64, 32); x.quadraticCurveTo(36, 36, 32, 64); x.quadraticCurveTo(28, 36, 0, 32); x.quadraticCurveTo(28, 28, 32, 0); x.fill();

};
document.title = 'ready';
</script></body></html>
