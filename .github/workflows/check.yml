# Checks every morning (04:00 Thailand time) for new official news and redeem codes, and opens an issue
# (GitHub e-mails the owner) when something changed. Data refreshes stay manual: they need tools/items_all.json,
# which is not kept in the repository.
name: Check for game updates
on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare with the site
        run: python3 tools/scrape.py --check | tee check.txt
      - name: Open or update an issue when something is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! grep -qE "NEW|no longer listed" check.txt; then echo "nothing new"; exit 0; fi
          body="$(printf 'ผลการเช็กอัตโนมัติ %s\n\n```\n%s\n```\n\nวิธีอัปเดต: ดู README หัวข้อ "อัปเดตข้อมูลเมื่อเกมอัปเดต"' "$(date -u +%F)" "$(cat check.txt)")"
          open=$(gh issue list --state open --label game-update --json number -q '.[0].number')
          if [ -n "$open" ]; then gh issue comment "$open" --body "$body"
          else
            gh label create game-update --color 7A5AD8 --description "New Aniimo news or codes" 2>/dev/null || true
            gh issue create --title "มีข่าวหรือโค้ด Aniimo ใหม่ที่เว็บยังไม่มี" --label game-update --body "$body"
          fi
