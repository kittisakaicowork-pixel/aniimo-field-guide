# Publishes the web build (the files in the repository root) to GitHub Pages.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html data.js items-more.js thumbs.js content.js i18n-en.js map.js map.webp map-icons.webp heist.js heist a p sitemap.xml skills.webp items.webp spark-*.webp manifest.webmanifest icon-192.png icon-512.png og.png favicon.png apple-touch-icon.png google9248935096adb7fc.html robots.txt sw.js img _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
